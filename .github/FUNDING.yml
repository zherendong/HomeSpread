# 저장소 위쪽에 `Sponsor` 단추를 띄운다.
#
# GitHub Sponsors 는 GitHub 이 이름으로 아는 창구라 주소가 아니라 **손잡이**를 적는다.
# 그 손잡이는 앱 안의 후원 단추가 가리키는 곳과 **같아야** 한다 — 두 곳이 어긋나면
# 어느 쪽이 진짜인지 알 길이 없다. 원본은 `src/ipsm/product.py` 의 `DONATE_ACCOUNT`
# 이고, 이 파일은 그것을 손으로 옮겨 적은 사본이다(YAML 에서는 계산할 수 없다).
# 계정을 옮기는 날 여기도 함께 고쳐야 하며, 시험이 두 곳을 대조한다.
#
# 처음에는 `custom:` 에 PayPal 주소를 적었는데, 받는 계정이 한국이라 PayPal 이
# 후원을 막았다(2026-08-28). 깨진 주소를 저장소에 올린 적은 없다.
#
# Store 정책 10.8.2 와 같은 선을 지킨다: 후원한 사람에게 아무것도 주지 않는다.
